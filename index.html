<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111014">
  <meta name="description" content="Paloma Powell — Fotógrafa y modelo.">
  <title>Paloma Powell — Fotógrafa · Modelo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --paper: #111014;
      --ink: #f6f0ed;
      --muted: #a9a0a4;
      --line: rgba(246, 240, 237, .16);
      --accent: #ff4d9d;
      --olive: #ffb166;
      --accent-soft: #ff8cbe;
      --accent-rgb: 255, 77, 157;
      --olive-rgb: 255, 177, 102;
      --heading-start: #ff75b4;
      --heading-end: #ffb166;
      --glow-one: rgba(255, 77, 157, .14);
      --glow-two: rgba(255, 111, 58, .1);
      --card-start: rgba(255, 255, 255, .045);
      --card-end: rgba(255, 255, 255, .012);
      --card-hover-start: rgba(255, 77, 157, .12);
      --card-hover-end: rgba(255, 177, 102, .04);
      font-family: "DM Sans", system-ui, sans-serif;
      background: var(--paper);
      color: var(--ink);
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(ellipse at 12% 18%, var(--glow-one), transparent 28rem),
        radial-gradient(ellipse at 88% 78%, var(--glow-two), transparent 32rem),
        var(--paper);
    }

    a { color: inherit; }

    .page {
      width: min(1120px, 100%);
      min-height: 100vh;
      margin-inline: auto;
      padding: clamp(24px, 5vw, 64px);
      display: flex;
      flex-direction: column;
    }

    .topbar {
      display: flex;
      align-items: center;
      padding: 0 0 18px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: .68rem;
      font-weight: 600;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    .topbar p { margin: 0; }

    main {
      flex: 1;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(280px, .75fr);
      align-items: center;
      gap: clamp(48px, 9vw, 120px);
      padding-block: clamp(56px, 10vh, 112px);
    }

    .intro { position: relative; }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 24px;
      color: var(--accent-soft);
      font-size: .72rem;
      font-weight: 600;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      width: 22px;
      height: 1px;
      background: linear-gradient(90deg, var(--accent), var(--olive));
      content: "";
    }

    h1 {
      max-width: 620px;
      margin: 0;
      font-family: "Playfair Display", Georgia, serif;
      font-size: clamp(4.5rem, 11vw, 8.8rem);
      font-weight: 500;
      letter-spacing: -.07em;
      line-height: .88;
    }

    h1 span { display: block; }
    h1 span:last-child {
      color: transparent;
      background: linear-gradient(105deg, var(--heading-start) 8%, var(--heading-end) 92%);
      background-clip: text;
      -webkit-background-clip: text;
      font-style: italic;
    }

    .role {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 30px 0 0;
      color: var(--muted);
      font-size: clamp(.78rem, 1.4vw, .92rem);
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .role::before, .role::after {
      width: 22px;
      height: 1px;
      background: var(--line);
      content: "";
    }

    .contact-links {
      display: flex;
      flex-wrap: nowrap;
      justify-content: center;
      gap: 12px;
      margin-top: 24px;
    }

    .contact-button {
      width: 46px;
      height: 46px;
      display: grid;
      align-items: center;
      justify-content: center;
      padding: 0;
      border: 1px solid rgba(var(--accent-rgb), .38);
      border-radius: 999px;
      background: linear-gradient(110deg, var(--card-start), var(--card-end));
      color: var(--ink);
      text-decoration: none;
      transition: border-color .2s ease, background .2s ease, color .2s ease, transform .2s ease;
    }

    .contact-button:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
      background: linear-gradient(110deg, var(--card-hover-start), var(--card-hover-end));
      color: var(--accent-soft);
    }

    .contact-button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 4px;
    }

    .contact-button svg {
      width: 20px;
      height: 20px;
      flex: 0 0 auto;
      fill: currentColor;
    }

    .mark {
      position: absolute;
      right: 4%;
      bottom: -60%;
      width: clamp(92px, 13vw, 150px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border: 1px solid rgba(var(--accent-rgb), .56);
      border-radius: 50%;
      color: var(--olive);
      font-family: "Playfair Display", Georgia, serif;
      font-size: clamp(2.4rem, 5vw, 4.5rem);
      font-style: italic;
      transform: rotate(-12deg);
      box-shadow: 0 0 44px rgba(var(--accent-rgb), .1), inset 0 0 32px rgba(var(--accent-rgb), .08);
    }

    .mark::before, .mark::after {
      position: absolute;
      inset: 8px;
      border: 1px solid rgba(var(--olive-rgb), .32);
      border-radius: inherit;
      content: "";
    }

    .mark::after { inset: -8px; border-color: rgba(var(--accent-rgb), .2); }

    .links-panel { align-self: center; }

    .section-label {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0 0 17px;
      color: var(--muted);
      font-size: .68rem;
      font-weight: 600;
      letter-spacing: .2em;
      text-transform: uppercase;
    }

    .section-label::after {
      flex: 1;
      height: 1px;
      background: var(--line);
      content: "";
    }

    .links {
      display: grid;
      gap: 11px;
    }

    .link-card {
      position: relative;
      min-height: 78px;
      display: grid;
      grid-template-columns: 42px 1fr 30px;
      align-items: center;
      gap: 14px;
      padding: 0 18px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 3px;
      background: linear-gradient(105deg, var(--card-start), var(--card-end));
      text-decoration: none;
      transition: transform .2s ease, border-color .2s ease, background .2s ease, color .2s ease;
    }

    .link-card::before {
      position: absolute;
      inset: 0 auto 0 0;
      width: 3px;
      background: linear-gradient(180deg, var(--accent), var(--olive));
      content: "";
      opacity: .8;
    }

    .link-card:hover {
      transform: translateX(4px);
      border-color: rgba(var(--accent-rgb), .58);
      background: linear-gradient(105deg, var(--card-hover-start), var(--card-hover-end));
      color: var(--accent-soft);
    }

    .link-card:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 5px;
    }

    .number {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border: 1px solid rgba(var(--accent-rgb), .38);
      border-radius: 50%;
      color: var(--accent-soft);
      font-size: .64rem;
      letter-spacing: .04em;
    }

    .link-title {
      font-family: "Playfair Display", Georgia, serif;
      font-size: clamp(1.4rem, 2.5vw, 1.9rem);
    }

    .arrow {
      display: grid;
      width: 30px;
      height: 30px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 50%;
      color: var(--olive);
      font-size: 1rem;
      transition: transform .2s ease, border-color .2s ease;
    }

    .link-card:hover .arrow {
      transform: rotate(45deg);
      border-color: rgba(var(--olive-rgb), .6);
    }

    footer {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: .72rem;
      letter-spacing: .04em;
    }

    footer p { margin: 0; }
    footer p:first-child { color: var(--ink); }

    @media (max-width: 700px) {
      .page { padding: 20px 20px 18px; }
      .topbar {
        padding-bottom: 14px;
      }
      main {
        grid-template-columns: 1fr;
        align-content: start;
        gap: 38px;
        padding-block: 44px 40px;
      }
      .intro { text-align: center; }
      .eyebrow { margin-bottom: 20px; }
      h1 { margin-inline: auto; }
      .role { justify-content: center; margin-top: 22px; }
      .mark { display: none; }
      .links-panel { width: 100%; }
      .section-label { margin-bottom: 12px; }
      .link-card {
        min-height: 74px;
        grid-template-columns: 36px 1fr 24px;
        gap: 12px;
        padding: 0 15px;
      }
      .link-title { font-size: 1.5rem; }
      footer { padding-top: 14px; }
    }

    @media (max-width: 420px) {
      .topbar { font-size: .6rem; }
      h1 { font-size: clamp(3.8rem, 18vw, 5rem); }
      footer { flex-direction: column; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body>

    </main>

    <footer>
      <p>&copy; 2026 Paloma Powell</p>
    </footer>
  </div>
</body>
</html>
